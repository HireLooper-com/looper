# Runs the Looper scheduler every 15 minutes. Vercel Hobby only allows a daily cron (vercel.json),
# so this calls /api/cron/tick from GitHub instead. Copy this file to .github/workflows/tick.yml in your repo,
# then set the LOOPER_URL variable and the CRON_SECRET secret in Settings > Secrets and variables > Actions.
# It lives outside .github/workflows so the Deploy to Vercel button can copy the repo: GitHub refuses
# workflow files from apps without the workflows permission.
name: Tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the scheduler
        env:
          URL: ${{ vars.LOOPER_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "Set LOOPER_URL and CRON_SECRET to turn this on."; exit 0; fi
          curl -fsS -m 300 -H "authorization: Bearer $SECRET" "${URL%/}/api/cron/tick"
